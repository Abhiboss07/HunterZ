name: Deploy HunterZ Web CRM to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run automated scrape & dashboard refresh every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml httpx jinja2 pydantic rich typer aiosqlite python-dotenv
          pip install -e .

      - name: Ingest Fresh Jobs from ATS Boards
        env:
          PYTHONPATH: .
        run: |
          python -m hunterz.cli scan --max-age 48 || true

      - name: Build Static GitHub Pages Site
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_pages.py

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
